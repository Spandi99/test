services:
  fluidcalendar:
    build:
      context: .
      dockerfile: docker/pi/Dockerfile
    image: fluid-calendar:pi
    ports:
      - "3000:3000"
      - "5232:5232"
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fluid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fluid}
      POSTGRES_DB: ${POSTGRES_DB:-fluid_calendar}
      RADICALE_USERNAME: ${RADICALE_USERNAME:-fluid}
      RADICALE_PASSWORD: ${RADICALE_PASSWORD:-fluid}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://192.168.1.132:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://192.168.1.132:3000}
    volumes:
      - postgres_pi_data:/var/lib/postgresql
      - radicale_pi_data:/var/lib/radicale
      - fluidcalendar_state:/var/lib/fluidcalendar
    restart: unless-stopped

volumes:
  postgres_pi_data:
  radicale_pi_data:
  fluidcalendar_state:
